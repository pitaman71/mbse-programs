[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbse-programs"
version = "0.3.27"
description = "Programs as language-neutral data: complete, serializable abstract syntax trees for C, C++, Python, TypeScript, JavaScript, Verilog and SystemVerilog, with their definitions, built for transpilers that never parse or print strings"
keywords = ["ast", "abstract syntax tree", "c++", "c", "python", "typescript", "javascript", "verilog", "systemverilog",
            "transpiler", "mbse", "tree-sitter", "slang", "code generation"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mbse-expressions>=0.5.2,<0.6",
    "mbse-schemas>=0.9.0,<0.10",
    "tree-sitter>=0.25",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "pyslang==12.0.0",
]

[project.optional-dependencies]
yaml = ["mbse-schemas[yaml]>=0.9.0,<0.10"]

[tool.setuptools.package-data]
"mbse.Programs" = ["skill/*.md", "skill/references/*.md"]

[tool.setuptools.packages.find]
include = ["mbse*"]
namespaces = true

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
    "pyyaml>=6",
]

[tool.uv.sources]
# the sibling checkouts: scripts/siblings.py
mbse-expressions = { path = "../../mbse-expressions/python3", editable = true }
mbse-schemas = { path = "../../mbse-schemas/python3", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "tutorials"]
addopts = "--nbmake"

[tool.coverage.run]
source = ["mbse.Programs"]
omit = ["*/mbse/Programs/Conformance/*"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
